      context_length: 200000
      source_ref: "https://www.anthropic.com/pricing"
      notes: "90% prompt cache read discount ($0.30/Mtok)"

    - raw_model_id: "claude-3-5-haiku-20241022"
      input_usd_mtok: 0.80
      output_usd_mtok: 4.00
      cache_read_usd_mtok: 0.08
