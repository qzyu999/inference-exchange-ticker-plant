apiVersion: tickerplant.inference.exchange/v1alpha1
kind: FeedHandler
metadata:
  name: anthropic
  venue_type: frontier-lab
  display_name: "Anthropic Direct API"
  tags: [proprietary, frontier, claude]
spec:
  driver: static-ratecard
  poll_interval: "24h"
  active: true
  quotes:
    - raw_model_id: "claude-3-5-sonnet-20241022"
      input_usd_mtok: 3.00
      output_usd_mtok: 15.00
