apiVersion: tickerplant.inference.exchange/v1alpha1
kind: FeedHandler
metadata:
  name: cerebras
  venue_type: asic-lpu
  display_name: "Cerebras (CS-3 Wafer Scale)"
  tags: [ultra-fast, wafer-scale, 1000tps]
spec:
  driver: static-ratecard
  poll_interval: "24h"
  active: true
  quotes:
    - raw_model_id: "llama3.1-8b"
      input_usd_mtok: 0.10
      output_usd_mtok: 0.10
      context_length: 8192
      tps: 1800
      source_ref: "https://cerebras.ai/pricing"
      notes: "Wafer-scale engine, ~1,800 tok/s"

    - raw_model_id: "llama3.1-70b"
      input_usd_mtok: 0.60
      output_usd_mtok: 0.60
      context_length: 8192
      tps: 450
      source_ref: "https://cerebras.ai/pricing"
      notes: "Wafer-scale engine, ~450 tok/s"

    - raw_model_id: "llama-3.3-70b"
      input_usd_mtok: 0.60
      output_usd_mtok: 0.60
      context_length: 8192
      tps: 450
      source_ref: "https://cerebras.ai/pricing"
